name: Release

# Manual: Actions tab -> Release -> Run workflow. The version bump, CHANGELOG.md and
# GitHub release are generated from conventional commits since the last tag
# (feat -> minor, fix/perf -> patch while on 0.x).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6

      - name: Same checks as CI
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run pytest -q
          uv run rentsmart-eval --check

      - name: Version, changelog, tag, GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uvx --from python-semantic-release==10.7.0 semantic-release version
          uvx --from python-semantic-release==10.7.0 semantic-release publish
